name: Mast Reforestation
description: Mast Reforestation (formerly DroneSeed) is North America's leading post-fire reforestation
  and carbon-removal company, restoring wildfire-damaged forests across the American West. It operates
  two nurseries, Cal Forest Nurseries and Silvaseed, manages the largest seed bank in the western United
  States, grows more than 30 million seedlings annually, and develops carbon-removal credits by burying
  post-wildfire biomass to finance reforestation for landowners and consulting foresters. Mast publishes
  no public developer program or API surface.
